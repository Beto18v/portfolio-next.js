<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="50%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <!-- Node Gradient Backgrounds -->
    <linearGradient id="node-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a22"/>
      <stop offset="100%" stop-color="#111218"/>
    </linearGradient>

    <linearGradient id="node-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232018"/>
      <stop offset="100%" stop-color="#141310"/>
    </linearGradient>

    <!-- Glowing Spline Cable Gradients -->
    <linearGradient id="cable-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="50%" stop-color="#f5c26b"/>
      <stop offset="100%" stop-color="#e8a33d"/>
    </linearGradient>

    <linearGradient id="cable-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cable-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Dot Grid Pattern (Authentic n8n canvas) -->
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#e8a33d" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- ─── Canvas Background & Grid ─── -->
  <rect width="1000" height="650" fill="url(#canvas-bg)"/>
  <rect width="1000" height="650" fill="url(#dot-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="240" r="240" fill="#e8a33d" fill-opacity="0.07" filter="url(#soft-glow)"/>
  <circle cx="780" cy="380" r="260" fill="#34d399" fill-opacity="0.06" filter="url(#soft-glow)"/>

  <!-- ─── Top n8n Studio Toolbar ─── -->
  <g transform="translate(40, 28)">
    <rect width="920" height="52" rx="12" fill="#13151c" fill-opacity="0.95" stroke="#252834" stroke-width="1"/>
    
    <!-- Left: n8n Icon & Workflow Name -->
    <g transform="translate(20, 16)">
      <!-- n8n Node Mark -->
      <rect width="20" height="20" rx="6" fill="#e8a33d"/>
      <circle cx="6" cy="10" r="2.5" fill="#111218"/>
      <circle cx="14" cy="10" r="2.5" fill="#111218"/>
      <path d="M 6 10 L 14 10" stroke="#111218" stroke-width="2"/>
      
      <text x="30" y="15" fill="#f3f4f6" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">
        B2B Prospecting &amp; WhatsApp Dispatch
      </text>
      <rect x="330" y="0" width="86" height="20" rx="10" fill="#e8a33d" fill-opacity="0.12" stroke="#e8a33d" stroke-opacity="0.3"/>
      <text x="373" y="14" fill="#e8a33d" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">PRODUCTION</text>
    </g>

    <!-- Right: Active Toggle & Test Button -->
    <g transform="translate(680, 13)">
      <!-- Active Switch -->
      <rect width="96" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <circle cx="16" cy="13" r="5" fill="#34d399" filter="url(#soft-glow)"/>
      <text x="56" y="17" fill="#34d399" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">ACTIVE</text>

      <!-- Execute / Test Button -->
      <g transform="translate(110, 0)">
        <rect width="110" height="26" rx="8" fill="#e8a33d" fill-opacity="0.15" stroke="#e8a33d" stroke-opacity="0.4"/>
        <path d="M 16 9 L 23 13 L 16 17 Z" fill="#e8a33d"/>
        <text x="64" y="17" fill="#f9fafb" font-size="11" font-family="-apple-system, sans-serif" font-weight="600" text-anchor="middle">Test step</text>
      </g>
    </g>
  </g>

  <!-- ─── Authentic n8n Sticky Note ─── -->
  <g transform="translate(80, 120)" filter="url(#card-shadow)">
    <rect width="210" height="96" rx="10" fill="#1e1b14" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="210" height="22" rx="10" fill="#e8a33d" fill-opacity="0.15"/>
    <circle cx="14" cy="11" r="3.5" fill="#e8a33d"/>
    <text x="24" y="15" fill="#e8a33d" font-size="10" font-family="monospace" font-weight="700">NOTE // REGLA DE NEGOCIO</text>
    
    <text x="14" y="44" fill="#f3f4f6" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Filtro Anti-Duplicados:</text>
    <text x="14" y="60" fill="#d1d5db" font-size="10" font-family="-apple-system, sans-serif">Valida contra base histórica.</text>
    <text x="14" y="76" fill="#9ca3af" font-size="10" font-family="-apple-system, sans-serif">Solo califica registros nuevos.</text>
    <!-- Arrow pointing to Node 2 -->
    <path d="M 210 50 C 260 50, 260 210, 310 210" fill="none" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  </g>

  <!-- ─── Connecting Curved Spline Cables (Bezier Curves) ─── -->
  <!-- Cable 1: Node 1 (Trigger) to Node 2 (Google Sheets) -->
  <path d="M 230 330 C 275 330, 275 250, 320 250" fill="none" stroke="url(#cable-gold)" stroke-width="3.5" filter="url(#cable-glow)"/>
  <path d="M 230 330 C 275 330, 275 250, 320 250" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="6 6"/>

  <!-- Cable 2: Node 2 (Google Sheets) to Node 3 (Places API + JS) -->
  <path d="M 480 250 C 525 250, 525 380, 570 380" fill="none" stroke="url(#cable-gold)" stroke-width="3.5" filter="url(#cable-glow)"/>
  <path d="M 480 250 C 525 250, 525 380, 570 380" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="6 6"/>

  <!-- Cable 3: Node 3 (Places API) to Node 4 (Telegram & WhatsApp) -->
  <path d="M 730 380 C 770 380, 770 300, 810 300" fill="none" stroke="url(#cable-green)" stroke-width="3.5" filter="url(#cable-glow)"/>
  <path d="M 730 380 C 770 380, 770 300, 810 300" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="6 6"/>


  <!-- ─── NODE 1: Schedule Trigger (Top-Left) ─── -->
  <g transform="translate(80, 270)" filter="url(#card-shadow)">
    <!-- Success Output Tag -->
    <rect x="90" y="-14" width="52" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="116" y="-2" fill="#34d399" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">&#x2713; 1 item</text>

    <!-- Node Card Body -->
    <rect width="150" height="120" rx="14" fill="url(#node-highlight)" stroke="#e8a33d" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#e8a33d"/>
    
    <!-- Node Icon & Title -->
    <rect x="16" y="18" width="34" height="34" rx="8" fill="#e8a33d" fill-opacity="0.15" stroke="#e8a33d" stroke-opacity="0.4"/>
    <!-- Clock Icon -->
    <path d="M 33 28 A 7 7 0 1 1 32.99 28 M 33 31 L 33 35 L 37 37" fill="none" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
    
    <text x="58" y="32" fill="#f9fafb" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">Schedule</text>
    <text x="58" y="45" fill="#e8a33d" font-size="9" font-family="monospace" font-weight="600">TRIGGER</text>
    
    <text x="16" y="76" fill="#d1d5db" font-size="11" font-family="-apple-system, sans-serif" font-weight="500">Cada mañana</text>
    <text x="16" y="92" fill="#9ca3af" font-size="10" font-family="-apple-system, sans-serif">08:30 AM Bogotá</text>
    
    <rect x="12" y="100" width="126" height="14" rx="4" fill="#000000" fill-opacity="0.4"/>
    <text x="75" y="110" fill="#9ca3af" font-size="8" font-family="monospace" text-anchor="middle">Cron: 30 8 * * 1-5</text>
    
    <!-- Output Pin (+) -->
    <circle cx="150" cy="60" r="7" fill="#e8a33d" stroke="#111218" stroke-width="2.5"/>
    <path d="M 147 60 L 153 60 M 150 57 L 150 63" stroke="#111218" stroke-width="1.8"/>
  </g>


  <!-- ─── NODE 2: Google Sheets Anti-Duplicados (Center-Top) ─── -->
  <g transform="translate(320, 190)" filter="url(#card-shadow)">
    <!-- Success Tag -->
    <rect x="90" y="-14" width="62" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="121" y="-2" fill="#34d399" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">&#x2713; 28 items</text>

    <rect width="160" height="120" rx="14" fill="url(#node-surface)" stroke="#2b2e3b" stroke-width="1.8"/>
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#34d399"/>
    
    <!-- Input Pin -->
    <circle cx="0" cy="60" r="7" fill="#e8a33d" stroke="#111218" stroke-width="2.5"/>

    <!-- Icon: Sheets Table -->
    <rect x="16" y="18" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <path d="M 27 27 L 39 27 L 39 43 L 27 43 Z M 27 32 L 39 32 M 32 27 L 32 43" fill="none" stroke="#34d399" stroke-width="1.6"/>
    
    <text x="58" y="32" fill="#f9fafb" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">Google Sheets</text>
    <text x="58" y="45" fill="#34d399" font-size="9" font-family="monospace" font-weight="600">DEDUPLICACIÓN</text>
    
    <text x="16" y="76" fill="#d1d5db" font-size="11" font-family="-apple-system, sans-serif" font-weight="500">Histórico de Leads</text>
    <text x="16" y="92" fill="#9ca3af" font-size="10" font-family="-apple-system, sans-serif">Filtro por Hash Único</text>
    
    <rect x="12" y="100" width="136" height="14" rx="4" fill="#10b981" fill-opacity="0.12"/>
    <text x="80" y="110" fill="#34d399" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">100% REGISTROS ÚNICOS</text>
    
    <!-- Output Pin (+) -->
    <circle cx="160" cy="60" r="7" fill="#34d399" stroke="#111218" stroke-width="2.5"/>
    <path d="M 157 60 L 163 60 M 160 57 L 160 63" stroke="#111218" stroke-width="1.8"/>
  </g>


  <!-- ─── NODE 3: Google Places API + JS Scoring (Center-Bottom) ─── -->
  <g transform="translate(570, 320)" filter="url(#card-shadow)">
    <!-- Success Tag & Timing -->
    <rect x="80" y="-14" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="115" y="-2" fill="#34d399" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">&#x2713; 25 leads · 38ms</text>

    <rect width="160" height="120" rx="14" fill="url(#node-surface)" stroke="#2b2e3b" stroke-width="1.8"/>
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#60a5fa"/>
    
    <!-- Input Pin -->
    <circle cx="0" cy="60" r="7" fill="#34d399" stroke="#111218" stroke-width="2.5"/>

    <!-- Icon: Places Map Pin -->
    <rect x="16" y="18" width="34" height="34" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
    <path d="M 33 26 A 5.5 5.5 0 0 1 38.5 31.5 C 38.5 36 33 41 33 41 C 33 41 27.5 36 27.5 31.5 A 5.5 5.5 0 0 1 33 26 Z" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
    <circle cx="33" cy="31.5" r="2" fill="#60a5fa"/>
    
    <text x="58" y="32" fill="#f9fafb" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">Places API + JS</text>
    <text x="58" y="45" fill="#60a5fa" font-size="9" font-family="monospace" font-weight="600">SCORING &amp; FILTRO</text>
    
    <text x="16" y="76" fill="#d1d5db" font-size="11" font-family="-apple-system, sans-serif" font-weight="500">Bogotá Comercial</text>
    <text x="16" y="92" fill="#9ca3af" font-size="10" font-family="-apple-system, sans-serif">Rating &gt;= 4.2 &amp; Teléfono</text>
    
    <rect x="12" y="100" width="136" height="14" rx="4" fill="#3b82f6" fill-opacity="0.12"/>
    <text x="80" y="110" fill="#60a5fa" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">LEADS CALIFICADOS</text>
    
    <!-- Output Pin (+) -->
    <circle cx="160" cy="60" r="7" fill="#60a5fa" stroke="#111218" stroke-width="2.5"/>
    <path d="M 157 60 L 163 60 M 160 57 L 160 63" stroke="#111218" stroke-width="1.8"/>
  </g>


  <!-- ─── NODE 4: Telegram & WhatsApp Deep-Link (Right) ─── -->
  <g transform="translate(810, 240)" filter="url(#card-shadow)">
    <!-- Success Tag -->
    <rect x="70" y="-14" width="75" height="18" rx="9" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="107" y="-2" fill="#4ade80" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">&#x2713; DISPATCH 100%</text>

    <rect width="150" height="120" rx="14" fill="url(#node-surface)" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#22c55e"/>
    
    <!-- Input Pin -->
    <circle cx="0" cy="60" r="7" fill="#60a5fa" stroke="#111218" stroke-width="2.5"/>

    <!-- Icon: Telegram Airplane / WhatsApp -->
    <rect x="16" y="18" width="34" height="34" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
    <path d="M 25 36 L 41 29 L 36 44 L 32 38 L 29 40 Z" fill="none" stroke="#4ade80" stroke-width="1.8"/>
    
    <text x="58" y="32" fill="#f9fafb" font-size="12" font-family="-apple-system, sans-serif" font-weight="700">Telegram Bot</text>
    <text x="58" y="45" fill="#4ade80" font-size="9" font-family="monospace" font-weight="600">WHATSAPP LINK</text>
    
    <text x="16" y="76" fill="#d1d5db" font-size="11" font-family="-apple-system, sans-serif" font-weight="500">Alerta Inmediata</text>
    <text x="16" y="92" fill="#9ca3af" font-size="10" font-family="-apple-system, sans-serif">Botón directo al decisor</text>
    
    <rect x="12" y="100" width="126" height="14" rx="4" fill="#22c55e" fill-opacity="0.15"/>
    <text x="75" y="110" fill="#86efac" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">CONTACTO EN 1-CLIC</text>
  </g>


  <!-- ─── Bottom-Left: Authentic n8n Canvas Zoom Controls ─── -->
  <g transform="translate(60, 570)">
    <rect width="130" height="36" rx="8" fill="#13151c" stroke="#262834" stroke-width="1"/>
    <!-- Minus -->
    <text x="20" y="23" fill="#9ca3af" font-size="16" font-family="monospace" text-anchor="middle" cursor="pointer">&#x2212;</text>
    <line x1="38" y1="8" x2="38" y2="28" stroke="#262834"/>
    <!-- Percentage -->
    <text x="65" y="22" fill="#f3f4f6" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">100%</text>
    <line x1="92" y1="8" x2="92" y2="28" stroke="#262834"/>
    <!-- Plus -->
    <text x="110" y="23" fill="#9ca3af" font-size="16" font-family="monospace" text-anchor="middle" cursor="pointer">+</text>
  </g>

  <!-- ─── Bottom-Right: Infrastructure Badge ─── -->
  <g transform="translate(710, 570)">
    <rect width="230" height="36" rx="8" fill="#13151c" stroke="#262834" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#34d399"/>
    <text x="32" y="22" fill="#9ca3af" font-size="11" font-family="-apple-system, sans-serif">Hetzner VPS · </text>
    <text x="105" y="22" fill="#e8a33d" font-size="11" font-family="monospace" font-weight="700">$0 costo ejecuciones</text>
  </g>
</svg>
